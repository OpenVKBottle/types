[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvkbottle-types"
description = "OpenVK API methods and types for OpenVKBottle."
version = "0.1.0"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

authors = [
    { name = "cynexeso", email = "cynexeso@gmail.ru" }
]
maintainers = [
    { name = "cynexeso", email = "cynexeso@gmail.ru" }
]

dependencies = [
"pydantic>=2.13.4,<3.0.0",
"typing-extensions>=4.16.0,<5.0.0",
"msgspec>=0.21.1,<0.22.0",
]

keywords = [
"openvk",
"ovk",
"openvkbottle",
"openvkbottle",
"ovk api",
"openvkontakte",
"types",
"api methods",
"api objects",
]

classifiers = [
"Intended Audience :: Developers",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Programming Language :: Python :: 3.14",
"Topic :: Software Development :: Libraries :: Python Modules",
"Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/openvkbottle/types"
Repository = "https://github.com/openvkbottle/types"
Issues = "https://github.com/openvkbottle/openvkbottle/issues"
"Original project" = "https://github.com/vkbottle/types"

[dependency-groups]
dev = [
"ruff>=0.16.4",
"requests>=2.34.2",
"tqdm>=4.70.0",
"dataclass-factory>=2.16",
"jinja2>=3.1.6",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = [
"I",
"D",
"N",
"PLR",
"Q",
"COM",
"TC",
"YTT",
"SIM",
"RUF022",
]
ignore = [
"COM812",
"N805",
"N818",
"TC001",
"TC002",
"TC003",
"TC004",
"D100",
"D101",
"D102",
"D103",
"D104",
"D105",
"D107",
"D202",
"D203",
"D205",
"D209",
"D211",
"D213",
"D400",
"D401",
"D404",
"D415",
"PLR2004",
"PLR0911",
"PLR0912",
"PLR0913",
]
fixable = ["ALL"]
unfixable = ["ERA"]
exclude = [".venv", ".idea"]

[tool.ruff.lint.per-file-ignores]
"**init**.py" = ["F401", "F403"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pyright]
exclude = [
".venv",
".idea",
".ruff_cache",
".pytest_cache",
]
typeCheckingMode = "basic"
pythonPlatform = "All"
pythonVersion = "3.10"
reportMissingImports = true
reportMissingTypeStubs = false
reportSelfClsParameterName = false